<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Accident Emergency Alert System</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-danger" href="index.html">
                <div class="logo-pulse">
                    <i class="bi bi-shield-fill-exclamation fs-3"></i>
                </div>
                <span class="brand-text tracking-tight">SOS RESCUE</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-3 logo-pulse">
                        <i class="bi bi-shield-fill-exclamation fs-1"></i>
                    </div>
                    <h2 class="fw-bold tracking-tight text-slate-900">Sign In</h2>
                    <p class="text-muted text-sm">Access your emergency rescue portal</p>
                </div>
                
                <div id="error-alert" class="alert alert-danger border-0 shadow-sm rounded-3 d-none mb-3 text-sm"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-slate-700">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-start-0 rounded-end-3 py-2.5" id="email" required placeholder="name@domain.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-slate-700">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control bg-light border-start-0 rounded-end-3 py-2.5" id="password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-danger w-100 rounded-3 py-2.5 fw-bold fs-5 shadow-sm">
                        Log In
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-2 border-top border-slate-100">
                    <p class="mb-0 text-sm">Don't have an account? <a href="register.html" class="text-danger fw-semibold">Register here</a></p>
                </div>
                
                <!-- Credentials helpers -->
                <div class="mt-4 p-3 bg-light rounded-4 border border-light-subtle">
                    <span class="badge bg-slate-900 mb-2">Demo Credentials</span>
                    <p class="mb-1 text-xs text-slate-600"><strong>Admin Account:</strong> admin@emergency.com / admin123</p>
                    <p class="mb-0 text-xs text-slate-600"><strong>Normal Account:</strong> Register a new account to test SOS flow.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('error-alert');

            try {
                const user = DB.login(email, password);
                errDiv.classList.add('d-none');
                window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
