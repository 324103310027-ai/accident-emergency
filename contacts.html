<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts - Accident Emergency Alert System</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-slate-900 sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-danger" href="dashboard.html">
                <div class="logo-pulse">
                    <i class="bi bi-shield-fill-exclamation fs-3"></i>
                </div>
                <span class="brand-text tracking-tight">SOS RESCUE</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-house-door me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-danger" href="contacts.html">
                            <i class="bi bi-people me-1"></i> Emergency Contacts
                        </a>
                    </li>
                    <span id="nav-auth-section" class="d-flex align-items-center"></span>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold tracking-tight text-slate-900 mb-1">Emergency Contacts</h2>
                    <p class="text-muted text-sm mb-0">Manage the contacts notified when you trigger the SOS button.</p>
                </div>
                <button class="btn btn-danger rounded-pill px-4 py-2 shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#addContactModal">
                    <i class="bi bi-person-plus-fill fs-5"></i> Add Contact
                </button>
            </div>

            <!-- Contacts Grid -->
            <div class="row g-4" id="contacts-container">
                <!-- Dynamically loaded via js -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-4 bg-slate-900 border-top border-slate-800 text-slate-400">
        <div class="container text-center">
            <p class="mb-1 fw-semibold">&copy; 2026 SOS Rescue System. All rights reserved.</p>
            <p class="mb-0 text-sm">Static Demo optimized for GitHub Pages.</p>
        </div>
    </footer>

    <!-- Add Contact Modal -->
    <div class="modal fade" id="addContactModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-slate-900 text-white border-0 py-3">
                    <h5 class="modal-title fw-bold">Add Emergency Contact</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="add-contact-form">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="add_name" class="form-label fw-semibold text-slate-700">Contact Name</label>
                            <input type="text" class="form-control rounded-3" id="add_name" placeholder="Contact's Name" required>
                        </div>
                        <div class="mb-3">
                            <label for="add_phone" class="form-label fw-semibold text-slate-700">Phone Number</label>
                            <input type="tel" class="form-control rounded-3" id="add_phone" placeholder="Phone Number" required>
                        </div>
                        <div class="mb-3">
                            <label for="add_email" class="form-label fw-semibold text-slate-700">Email Address</label>
                            <input type="email" class="form-control rounded-3" id="add_email" placeholder="Email Address" required>
                        </div>
                        <div class="mb-3">
                            <label for="add_relationship" class="form-label fw-semibold text-slate-700">Relationship</label>
                            <select class="form-select rounded-3" id="add_relationship" required>
                                <option value="">Select Relationship</option>
                                <option value="Parent">Parent</option>
                                <option value="Spouse">Spouse</option>
                                <option value="Sibling">Sibling</option>
                                <option value="Child">Child</option>
                                <option value="Friend">Friend</option>
                                <option value="Doctor">Doctor</option>
                                <option value="Neighbor">Neighbor</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0 py-3">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger rounded-pill px-4">Add Contact</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Contact Modal -->
    <div class="modal fade" id="editContactModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header bg-slate-900 text-white border-0 py-3">
                    <h5 class="modal-title fw-bold">Edit Emergency Contact</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="edit-contact-form">
                    <input type="hidden" id="edit_id">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label for="edit_name" class="form-label fw-semibold text-slate-700">Contact Name</label>
                            <input type="text" class="form-control rounded-3" id="edit_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit_phone" class="form-label fw-semibold text-slate-700">Phone Number</label>
                            <input type="tel" class="form-control rounded-3" id="edit_phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit_email" class="form-label fw-semibold text-slate-700">Email Address</label>
                            <input type="email" class="form-control rounded-3" id="edit_email" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit_relationship" class="form-label fw-semibold text-slate-700">Relationship</label>
                            <select class="form-select rounded-3" id="edit_relationship" required>
                                <option value="Parent">Parent</option>
                                <option value="Spouse">Spouse</option>
                                <option value="Sibling">Sibling</option>
                                <option value="Child">Child</option>
                                <option value="Friend">Friend</option>
                                <option value="Doctor">Doctor</option>
                                <option value="Neighbor">Neighbor</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0 py-3">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-danger rounded-pill px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderContacts();

            // Add Contact Form Submit
            document.getElementById('add-contact-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('add_name').value.trim();
                const phone = document.getElementById('add_phone').value.trim();
                const email = document.getElementById('add_email').value.trim();
                const relation = document.getElementById('add_relationship').value;

                DB.addContact(name, phone, email, relation);
                
                // Hide modal and reload
                const modal = bootstrap.Modal.getInstance(document.getElementById('addContactModal'));
                modal.hide();
                renderContacts();
                
                // Reset form
                document.getElementById('add-contact-form').reset();
            });

            // Edit Contact Form Submit
            document.getElementById('edit-contact-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('edit_id').value;
                const name = document.getElementById('edit_name').value.trim();
                const phone = document.getElementById('edit_phone').value.trim();
                const email = document.getElementById('edit_email').value.trim();
                const relation = document.getElementById('edit_relationship').value;

                DB.updateContact(id, name, phone, email, relation);

                const modal = bootstrap.Modal.getInstance(document.getElementById('editContactModal'));
                modal.hide();
                renderContacts();
            });
        });

        function renderContacts() {
            const container = document.getElementById('contacts-container');
            const contacts = DB.getUserContacts();
            
            container.innerHTML = '';

            if (contacts.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="card card-premium text-center p-5 border-dashed border-2">
                            <div class="d-inline-flex justify-content-center align-items-center bg-danger-subtle text-danger rounded-circle p-4 mb-3">
                                <i class="bi bi-people fs-1"></i>
                            </div>
                            <h4 class="fw-bold text-slate-900">No emergency contacts set up yet</h4>
                            <p class="text-muted text-sm max-w-md mx-auto mb-4">Adding emergency contacts is critical. When the SOS button is triggered, our system alerts these people instantly with your GPS location details.</p>
                            <button class="btn btn-danger rounded-pill px-4 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#addContactModal">
                                <i class="bi bi-person-plus-fill me-1"></i> Add First Contact
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            contacts.forEach(contact => {
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="card card-premium p-4 h-100 d-flex flex-column justify-content-between position-relative overflow-hidden">
                        <div class="position-absolute top-0 end-0 mt-3 me-3">
                            <span class="badge bg-slate-900 rounded-pill text-xs px-2.5 py-1">
                                ${contact.relationship}
                            </span>
                        </div>
                        
                        <div>
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div class="avatar bg-danger-subtle text-danger rounded-circle p-2.5 fs-4 fw-bold d-flex justify-content-center align-items-center" style="width: 48px; height: 48px;">
                                    ${contact.contact_name[0].toUpperCase()}
                                </div>
                                <div style="max-width: calc(100% - 70px);">
                                    <h5 class="fw-bold text-slate-900 mb-0 text-truncate">${contact.contact_name}</h5>
                                    <small class="text-slate-500 fw-medium">Emergency Trustee</small>
                                </div>
                            </div>
                            
                            <div class="list-group list-group-flush gap-2 text-sm mb-4">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-telephone text-muted"></i>
                                    <span class="text-slate-800 fw-medium">${contact.phone}</span>
                                </div>
                                <div class="d-flex align-items-center gap-2 text-truncate">
                                    <i class="bi bi-envelope text-muted"></i>
                                    <span class="text-slate-800 text-truncate" title="${contact.email}">${contact.email}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2 pt-3 border-top border-slate-100">
                            <button class="btn btn-sm btn-outline-dark rounded-pill flex-grow-1 py-1.5 edit-btn" 
                                    data-id="${contact.id}"
                                    data-name="${contact.contact_name}"
                                    data-phone="${contact.phone}"
                                    data-email="${contact.email}"
                                    data-relation="${contact.relationship}">
                                <i class="bi bi-pencil me-1"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill flex-grow-1 py-1.5 delete-btn" data-id="${contact.id}">
                                <i class="bi bi-trash me-1"></i> Delete
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Bind Delete Buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (confirm("Are you sure you want to delete this contact?")) {
                        DB.deleteContact(this.getAttribute('data-id'));
                        renderContacts();
                    }
                });
            });

            // Bind Edit Buttons to Modal
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.getElementById('edit_id').value = this.getAttribute('data-id');
                    document.getElementById('edit_name').value = this.getAttribute('data-name');
                    document.getElementById('edit_phone').value = this.getAttribute('data-phone');
                    document.getElementById('edit_email').value = this.getAttribute('data-email');
                    document.getElementById('edit_relationship').value = this.getAttribute('data-relation');
                    
                    const editModal = new bootstrap.Modal(document.getElementById('editContactModal'));
                    editModal.show();
                });
            });
        }
    </script>
</body>
</html>
